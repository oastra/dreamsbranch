    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --blue: #0057b8;
        --blue-dark: #003066;
        --yellow: #ffd700;
        --yellow-dark: #ffdf33;
        --white: #ffffff;
        --text-secondary: #94a3b8;
        --surface: #f8fafc;
      }

      html,
      body {
        height: 100%;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        min-height: 100vh;
        background: var(--blue);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        position: relative;
        overflow: hidden;
      }

      /* Background decoration */
      body::before {
        content: "";
        position: fixed;
        top: -30%;
        right: -20%;
        width: 600px;
        height: 600px;
        background: radial-gradient(
          circle,
          rgba(251, 191, 36, 0.12) 0%,
          transparent 70%
        );
        pointer-events: none;
      }
      body::after {
        content: "";
        position: fixed;
        bottom: -30%;
        left: -20%;
        width: 600px;
        height: 600px;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.06) 0%,
          transparent 70%
        );
        pointer-events: none;
      }

      .card {
        position: relative;
        z-index: 1;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 3rem 2.5rem;
        max-width: 540px;
        width: 100%;
        text-align: center;
        backdrop-filter: blur(12px);
      }

      .logo-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        margin-bottom: 2.5rem;
      }

      .logo-icon {
        width: 52px;
        height: 52px;
        flex-shrink: 0;
      }

      .logo-icon svg {
        width: 100%;
        height: 100%;
      }

      /* Invert SVG paths from blue to white */
      .logo-icon svg path {
        fill: #ffffff;
      }

      .logo-text {
        text-align: left;
      }

      .logo-name {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--white);
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      .logo-sub {
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.55);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-top: 2px;
      }

      .badge {
        display: inline-block;
        background: rgba(251, 191, 36, 0.15);
        color: var(--yellow);
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 0.35rem 0.9rem;
        border-radius: 100px;
        border: 1px solid rgba(251, 191, 36, 0.3);
        margin-bottom: 1.25rem;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 2.75rem);
        font-weight: 700;
        color: var(--white);
        line-height: 1.15;
        letter-spacing: -0.03em;
        margin-bottom: 1rem;
      }

      h1 span {
        color: var(--yellow);
      }

      .description {
        font-size: 1rem;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.65);
        margin-bottom: 2.5rem;
        max-width: 400px;
        margin-left: auto;
        margin-right: auto;
      }

      .divider {
        height: 1px;
        background: rgba(255, 255, 255, 0.08);
        margin: 0 -0.5rem 2rem;
      }

      .notify-label {
        font-size: 0.8rem;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.5);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 0.75rem;
      }

      .email-form {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .email-input {
        flex: 1;
        min-width: 0;
        padding: 0.75rem 1rem;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.08);
        color: var(--white);
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.2s;
      }
      .email-input::placeholder {
        color: rgba(255, 255, 255, 0.35);
      }
      .email-input:focus {
        border-color: rgba(255, 255, 255, 0.4);
      }

      .btn-notify {
        padding: 0.75rem 1.25rem;
        border-radius: 10px;
        border: none;
        background: var(--yellow);
        color: #1a1a1a;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background 0.2s,
          transform 0.1s;
      }
      .btn-notify:hover {
        background: var(--yellow-dark);
      }
      .btn-notify:active {
        transform: scale(0.97);
      }

      .success-msg {
        display: none;
        font-size: 0.875rem;
        color: #86efac;
        margin-top: 0.75rem;
        padding: 0.6rem 1rem;
        background: rgba(134, 239, 172, 0.1);
        border-radius: 8px;
        border: 1px solid rgba(134, 239, 172, 0.2);
      }

      .social-row {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: 2rem;
      }

      .social-link {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
        color: rgba(255, 255, 255, 0.6);
        text-decoration: none;
        transition:
          border-color 0.2s,
          background 0.2s,
          color 0.2s;
      }
      .social-link:hover {
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.1);
        color: var(--white);
      }
      .social-link svg {
        width: 18px;
        height: 18px;
      }

      .footer-note {
        margin-top: 2.5rem;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.25);
      }

      @media (max-width: 480px) {
        .card {
          padding: 2rem 1.5rem;
        }
        .email-form {
          flex-direction: column;
        }
        .btn-notify {
          width: 100%;
        }
      }
    </style>
  </head>
